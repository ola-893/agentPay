<template><link rel="stylesheet" href="assets/style.css"><div id="root" data-composition-id="captions" data-duration="269.7667" style="background:transparent"><div id="caption-0" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>An agent making a thousand paid API calls should not need a thousand payment transactions.</span></div>
<div id="caption-1" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>AgentPay combines a funded stream with Chainlink C R E supervision.</span></div>
<div id="caption-2" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Paying separately for every request couples useful work to repeated blockchain transactions.</span></div>
<div id="caption-3" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>A funded stream separates the request loop from the payment lifecycle.</span></div>
<div id="caption-4" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The contract accrues earnings with time; it does not meter API calls.</span></div>
<div id="caption-5" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>But that creates another problem: who decides when paying should start, continue, or stop?</span></div>
<div id="caption-6" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>If a provider becomes unavailable while time keeps passing, funds can keep accruing.</span></div>
<div id="caption-7" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The stream handles settlement. The workflow supplies a decision about whether the session should remain open.</span></div>
<div id="caption-8" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Follow the agent, its wallet, the escrow, and the paid service.</span></div>
<div id="caption-9" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The wallet funds escrow, then service requests reuse the active session.</span></div>
<div id="caption-10" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>C R E connects a separate supervision loop to that payment lifecycle.</span></div>
<div id="caption-11" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Coinbase supplies an external U S D C quote. Chainlink supplies the Sepolia U S D C dollar feed.</span></div>
<div id="caption-12" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The supervisor also fetches service health and reads token balances and stream state on Sepolia.</span></div>
<div id="caption-13" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Those observations produce OPEN, CONTINUE, CLOSE, or DENY.</span></div>
<div id="caption-14" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The wallet C L I validates the local results before it signs.</span></div>
<div id="caption-15" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>On the C R E network, a deployed workflow runs on a decentralized oracle network.</span></div>
<div id="caption-16" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>This demonstration uses the local C L I simulator. It has no D O N authorization.</span></div>
<div id="caption-17" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The H T T P capability fetches Coinbase. The E V M capability reads the Sepolia feed.</span></div>
<div id="caption-18" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>This recording observed Coinbase at 1.00000000 dollars and Chainlink at 0.99990493 dollars.</span></div>
<div id="caption-19" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Both the peg and source disagreement limits are 100 basis points.</span></div>
<div id="caption-20" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The feed was 8273 seconds old against a limit of 86400 seconds.</span></div>
<div id="caption-21" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Fresh inputs can change the decision.</span></div>
<div id="caption-22" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Admission checks bind service health, the payment token, its decimals, balance, budget, and rate.</span></div>
<div id="caption-23" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The deposit is 0.01 test U S D C, below a 0.1 cap.</span></div>
<div id="caption-24" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The actual rate is 0.00001 U S D C per second, below the 0.0001 maximum.</span></div>
<div id="caption-25" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>At checkpoints, the supervisor checks stream identity, accrued funds, availability, and failure counts.</span></div>
<div id="caption-26" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The saved simulator log shows compilation, the external quote, the chain observation, and the resulting approval.</span></div>
<div id="caption-27" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Now follow the recorded funded run. Waiting time is condensed.</span></div>
<div id="caption-28" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The agent is explicitly prompted to try an in-budget session and an over-budget session.</span></div>
<div id="caption-29" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>After approval, the wallet signs a token allowance and opens the funded stream.</span></div>
<div id="caption-30" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The service records 10 successful requests, reusing the same stream.</span></div>
<div id="caption-31" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>A healthy checkpoint returns CONTINUE. Requests reuse the stream.</span></div>
<div id="caption-32" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The demo injects H T T P 503 responses and records 3 failures.</span></div>
<div id="caption-33" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>C R E returns CLOSE. The wallet then signs cancellation; the contract settles elapsed earnings.</span></div>
<div id="caption-34" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>0.01 test U S D C splits into 0.00096 earned and 0.00904 refunded.</span></div>
<div id="caption-35" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>This card comes from saved R P C verification, not an explorer screenshot.</span></div>
<div id="caption-36" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The premium quote is 0.2 against the 0.1 cap. DENY prevents that session opening.</span></div>
<div id="caption-37" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The capture also contains 4 separate audit receipts. These are additional transactions.</span></div>
<div id="caption-38" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>No premium payment is signed; an audit receipt still follows the block.</span></div>
<div id="caption-39" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The dashboard reads the same saved event stream used to build this video.</span></div>
<div id="caption-40" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>It displays decisions, request counters, transaction links, and the earnings and refund split.</span></div>
<div id="caption-41" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The interface computes no policy decision.</span></div>
<div id="caption-42" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>A real browser recording belongs here. Capture access was unavailable, so this draft shows a labeled placeholder.</span></div>
<div id="caption-43" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Be precise about enforcement: local C R E simulation proposes a decision; the wallet C L I gates signing.</span></div>
<div id="caption-44" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>The stream contract does not verify C R E results. A different wallet client can bypass that gate.</span></div>
<div id="caption-45" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Localhost health snapshots and per-run configurations are demonstration shortcuts, not independent proof of service quality.</span></div>
<div id="caption-46" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>This uses valueless test U S D C, is not a full x four oh two implementation, and is unaudited.</span></div>
<div id="caption-47" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>A production path needs a deployed workflow, a public health endpoint, trigger payloads, and authenticated reports.</span></div>
<div id="caption-48" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>A forwarder and onchain consumer would move authorization into the contract path. That is future work for this stream demo.</span></div>
<div id="caption-49" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Follow the documented prerequisites.</span></div>
<div id="caption-50" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Start with the read-only C R E scenarios, then the preview agent demo.</span></div>
<div id="caption-51" class="caption" style="opacity:0" data-layout-allow-caption-zone><span>Use the funded command only with a prepared Sepolia wallet.</span></div>
